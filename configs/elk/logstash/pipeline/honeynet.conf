# VERIFIED TRANSCRIPTION: S1 figures 2.8 and 2.9; whitespace normalized.
input {
  beats {
    port => 5044
  }
}

filter {
  if [honeypot] == "cowrie" and [cowrie][timestamp] {
    date {
      match => ["[cowrie][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  if [honeypot] == "dionaea" {
    grok {
      match => {
        "message" => "accepted connection from %{IP:src_ip}:%{NUMBER:src_port:int} to %{IP:dst_ip}:%{NUMBER:dst_port:int} \(id=%{NUMBER:connection_id:int}\)"
      }
      tag_on_failure => ["_dionaea_grok_failure"]
    }
    mutate {
      add_field => {
        "protocol" => "tcp"
        "target_ip" => "192.168.100.20"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "honeynet-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
